name: CI - Build & Test

on:
  push:
    branches: [main, master, "v2.*"]
  pull_request:
    branches: [main, master, "v2.*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages (Turbo)
        run: pnpm run build

      - name: Type Check (Strict TypeScript)
        run: |
          pnpm --filter @bintangstudio/livechat-sdk exec tsc --noEmit
          pnpm --filter @bintangstudio/livechat-widget exec tsc --noEmit
          pnpm --filter @bintangstudio/livechat-react exec tsc --noEmit
          pnpm --filter bsd-livechat-gateway exec tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: pnpm test

